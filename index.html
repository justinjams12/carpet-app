<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Choice Floors - Integrated Entry</title>
    <style>
        :root {
            --navy: #0f172a; --gold: #c5a059; --blueprint-bg: #1e293b;
            --glass: rgba(255, 255, 255, 0.95); --text: #334155; --danger: #ef4444;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background: #f1f5f9; color: var(--text); padding-bottom: 60px; }
        .app-shell { width: 100%; max-width: 480px; margin: auto; padding: 20px; box-sizing: border-box; }
        
        .tabs { display: flex; background: var(--navy); padding: 5px; border-radius: 15px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: white; font-weight: 700; cursor: pointer; border-radius: 10px; opacity: 0.6; }
        .tab-btn.active { background: var(--gold); opacity: 1; }

        .view { display: none; }
        .view.active { display: block; }

        .live-result { background: var(--navy); color: white; border-radius: 24px; padding: 25px; text-align: center; margin-bottom: 20px; }
        .blueprint-card { background: var(--blueprint-bg); border-radius: 20px; padding: 15px; margin-bottom: 20px; border: 2px solid #334155; }
        #blueprint { width: 100%; height: 180px; }
        .seam-line { stroke: var(--danger); stroke-width: 2; stroke-dasharray: 4,4; }

        .card { background: var(--glass); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid white; position: relative; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .section-title { font-size: 0.75rem; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        
        .advanced-trigger { background: #f1f5f9; border: 1px dashed #cbd5e1; padding: 10px; border-radius: 10px; font-size: 0.7rem; font-weight: 800; color: #64748b; text-align: center; cursor: pointer; margin-bottom: 15px; text-transform: uppercase; }
        .advanced-content { display: none; padding-top: 10px; border-top: 1px solid #e2e8f0; margin-top: 10px; }
        .advanced-content.show { display: block; }

        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-add { background: var(--navy); color: white; }
        .btn-save { background: var(--gold); color: white; }
        
        .action-group { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; }
        .btn-small { border: none; padding: 5px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        .btn-edit { background: #dcfce7; color: #166534; }
        .btn-delete { background: #fee2e2; color: var(--danger); }
        
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #e2e8f0; margin-bottom: 10px; box-sizing: border-box; }
        label { font-size: 0.6rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 4px; display: block; }

        .room-tag { background: #f8fafc; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 4px solid var(--gold); font-size: 0.85rem; position: relative; }
        .dim-badge { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; color: var(--navy); margin-right: 5px; }
        .room-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
        .edit-icon { cursor: pointer; font-size: 1rem; opacity: 0.6; }
    </style>
</head>
<body>

<div class="app-shell">
    <header style="text-align:center; padding-bottom:15px;"><img src="choice-floors-logo.png" style="height:40px;"></header>

    <div class="tabs">
        <button class="tab-btn active" id="tab-workspace" onclick="switchTab('workspace')">Workspace</button>
        <button class="tab-btn" id="tab-history" onclick="switchTab('history')">Job History</button>
    </div>

    <div id="workspace" class="view active">
        <div class="live-result">
            <div id="projectHeader" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.8; margin-bottom: 5px;">New Project</div>
            <div id="displayTotal" style="font-size: 2.2rem; font-weight: 800; color: var(--gold);">$0.00</div>
            <div id="displaySub" style="font-size: 0.85rem; font-weight: 600;">0.00 Yds | 0 SqFt</div>
        </div>

        <div class="blueprint-card">
            <svg id="blueprint" viewBox="0 0 200 200">
                <rect id="roomRect" x="50" y="50" width="0" height="0" fill="rgba(197, 160, 89, 0.15)" stroke="#c5a059" stroke-width="1.5" />
                <g id="seamGroup"></g>
            </svg>
        </div>

        <div class="card">
            <div class="section-title">Project Details</div>
            <label>Customer / Job Name</label>
            <input type="text" id="jobName" placeholder="Enter Name (e.g. Smith Residence)" oninput="updateJobHeader()">

            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0;">
                <div class="section-title" id="formTitle">Room Measurement</div>
                <input type="text" id="roomName" placeholder="Room Name (e.g. Living Room)">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div><label>Width (ft)</label><input type="number" id="wA" placeholder="0" oninput="drawBlueprint()"></div>
                    <div><label>Length (ft)</label><input type="number" id="lB" placeholder="0" oninput="drawBlueprint()"></div>
                </div>

                <div class="advanced-trigger" onclick="toggleAdvanced()">⚙ Advanced Settings</div>
                <div id="advContent" class="advanced-content">
                    <label>Roll Width</label>
                    <select id="rollWidth" onchange="drawBlueprint()">
                        <option value="12">12' Standard</option>
                        <option value="15">15' Wide</option>
                        <option value="13.5">13.5' Specialty</option>
                    </select>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div><label>Waste %</label><input type="number" id="wastePct" value="10" oninput="drawBlueprint()"></div>
                        <div><label>Pattern Repeat (in)</label><input type="number" id="patternRepeat" value="0" oninput="drawBlueprint()"></div>
                    </div>
                    <label>Seam Overlap (inches)</label>
                    <input type="number" id="seamOverlap" value="3" oninput="drawBlueprint()">
                </div>

                <button class="btn btn-add" id="btnAddRoom" onclick="addOrUpdateRoom()">+ Add Room to List</button>
            </div>
        </div>

        <div class="card" id="roomListCard" style="display:none;">
            <div class="section-title">Project Summary</div>
            <div id="currentRooms"></div>
            <button class="btn btn-save" onclick="finalizeJob()">Finalize & Save Project</button>
        </div>
    </div>

    <div id="history" class="view">
        <input type="text" id="historySearch" class="search-input" placeholder="🔍 Search History..." oninput="loadHistory()" style="width:100%; padding:12px; border-radius:10px; border:2px solid var(--navy); margin-bottom:15px;">
        <div id="historyList"></div>
    </div>
</div>

<script>
    let currentJobRooms = [];
    let editingJobId = null;
    let editingRoomIndex = null;

    function updateJobHeader() {
        let name = document.getElementById('jobName').value;
        document.getElementById('projectHeader').innerText = name ? name : "New Project";
    }

    function toggleAdvanced() { document.getElementById('advContent').classList.toggle('show'); }

    function switchTab(tabId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
        if(tabId === 'history') loadHistory();
    }

    function calculateValues(w, l) {
        let rW = parseFloat(document.getElementById('rollWidth').value);
        let waste = 1 + (parseFloat(document.getElementById('wastePct').value) / 100);
        let repeat = (parseFloat(document.getElementById('patternRepeat').value) || 0) / 12;
        let overlap = (parseFloat(document.getElementById('seamOverlap').value) || 0) / 12;
        let strips = Math.ceil(w / rW);
        let sqFt = strips * rW * (l + (strips > 1 ? overlap : 0) + repeat) * waste;
        return { yards: sqFt / 9, sqFt: sqFt };
    }

    function drawBlueprint() {
        let w = parseFloat(document.getElementById('wA').value) || 0;
        let l = parseFloat(document.getElementById('lB').value) || 0;
        let rW = parseFloat(document.getElementById('rollWidth').value);
        let rect = document.getElementById('roomRect');
        let seamGroup = document.getElementById('seamGroup');
        seamGroup.innerHTML = ""; 
        let scale = 150 / Math.max(w, l, 1);
        let dW = w * scale, dL = l * scale;
        let sX = (200 - dW) / 2, sY = (200 - dL) / 2;
        rect.setAttribute('width', dW); rect.setAttribute('height', dL);
        rect.setAttribute('x', sX); rect.setAttribute('y', sY);
        if (w > rW) {
            let numSeams = Math.floor((w - 0.01) / rW);
            for (let i = 1; i <= numSeams; i++) {
                let sX_pos = sX + (i * rW * scale);
                let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", sX_pos); line.setAttribute("y1", sY);
                line.setAttribute("x2", sX_pos); line.setAttribute("y2", sY + dL);
                line.setAttribute("class", "seam-line");
                seamGroup.appendChild(line);
            }
        }
        updateLiveTotals();
    }

    function updateLiveTotals() {
        let w = parseFloat(document.getElementById('wA').value) || 0;
        let l = parseFloat(document.getElementById('lB').value) || 0;
        if (w > 0 && l > 0) {
            let vals = calculateValues(w, l);
            document.getElementById('displayTotal').innerText = `$${(vals.yards * 35).toFixed(2)}`;
            document.getElementById('displaySub').innerText = `${vals.yards.toFixed(2)} Yds | ${Math.round(vals.sqFt)} SqFt`;
        }
    }

    function addOrUpdateRoom() {
        let w = parseFloat(document.getElementById('wA').value), l = parseFloat(document.getElementById('lB').value);
        if(!w || !l) return;
        
        let vals = calculateValues(w, l);
        let roomData = {
            name: document.getElementById('roomName').value || "Room " + (currentJobRooms.length + 1),
            w, l, yards: vals.yards, sqFt: vals.sqFt,
            settings: { 
                rW: document.getElementById('rollWidth').value,
                waste: document.getElementById('wastePct').value,
                repeat: document.getElementById('patternRepeat').value,
                overlap: document.getElementById('seamOverlap').value
            }
        };

        if(editingRoomIndex !== null) {
            currentJobRooms[editingRoomIndex] = roomData;
            editingRoomIndex = null;
            document.getElementById('btnAddRoom').innerText = "+ Add Room to List";
            document.getElementById('formTitle').innerText = "Room Measurement";
        } else {
            currentJobRooms.push(roomData);
        }

        updateRoomList();
        ['roomName','wA','lB'].forEach(id => document.getElementById(id).value = "");
        drawBlueprint();
    }

    function editRoom(index) {
        let r = currentJobRooms[index];
        editingRoomIndex = index;
        document.getElementById('roomName').value = r.name;
        document.getElementById('wA').value = r.w;
        document.getElementById('lB').value = r.l;
        document.getElementById('rollWidth').value = r.settings.rW;
        document.getElementById('wastePct').value = r.settings.waste;
        document.getElementById('patternRepeat').value = r.settings.repeat;
        document.getElementById('seamOverlap').value = r.settings.overlap;
        document.getElementById('btnAddRoom').innerText = "Update Room Details";
        document.getElementById('formTitle').innerText = "Editing: " + r.name;
        // Scroll to the edit section
        document.getElementById('formTitle').scrollIntoView({behavior: 'smooth'});
        drawBlueprint();
    }

    function updateRoomList() {
        let totalYds = currentJobRooms.reduce((s, r) => s + r.yards, 0);
        let totalSqFt = currentJobRooms.reduce((s, r) => s + r.sqFt, 0);
        document.getElementById('currentRooms').innerHTML = currentJobRooms.map((r, i) => `
            <div class="room-tag">
                <b>${r.name}</b>
                <div class="room-actions">
                    <span class="edit-icon" onclick="editRoom(${i})">✏️</span>
                    <span class="edit-icon" onclick="removeRoom(${i})" style="color:var(--danger)">✕</span>
                </div>
                <div style="margin-top:4px;"><span class="dim-badge">${r.w}' × ${r.l}'</span> ${r.yards.toFixed(2)} Yds | ${Math.round(r.sqFt)} SqFt</div>
            </div>`).join('');
        document.getElementById('roomListCard').style.display = currentJobRooms.length ? 'block' : 'none';
        document.getElementById('displayTotal').innerText = `$${(totalYds * 35).toFixed(2)}`;
        document.getElementById('displaySub').innerText = `${totalYds.toFixed(2)} Total Yds | ${Math.round(totalSqFt)} Total SqFt`;
    }

    function removeRoom(i) { currentJobRooms.splice(i, 1); updateRoomList(); }

    function finalizeJob() {
        let name = document.getElementById('jobName').value;
        if(!name) { alert("Please enter a Customer/Job Name."); return; }
        
        let history = JSON.parse(localStorage.getItem('choiceFloorsHistory') || '[]');
        let newJob = {
            id: editingJobId || Date.now(),
            name: name,
            date: new Date().toLocaleDateString(),
            rooms: currentJobRooms,
            total: document.getElementById('displayTotal').innerText,
            summary: document.getElementById('displaySub').innerText
        };
        
        if (editingJobId) {
            let index = history.findIndex(j => j.id === editingJobId);
            history[index] = newJob;
        } else {
            history.unshift(newJob);
        }
        
        localStorage.setItem('choiceFloorsHistory', JSON.stringify(history));
        currentJobRooms = []; editingJobId = null; editingRoomIndex = null;
        document.getElementById('jobName').value = "";
        updateJobHeader();
        updateRoomList();
        alert("Project Finalized Successfully!");
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem('choiceFloorsHistory') || '[]');
        let term = document.getElementById('historySearch').value.toLowerCase();
        let list = document.getElementById('historyList');
        let filtered = history.filter(h => h.name.toLowerCase().includes(term) || h.rooms.some(r => r.name.toLowerCase().includes(term)));

        list.innerHTML = filtered.map(h => `
            <div class="card">
                <div class="action-group">
                    <button class="btn-small btn-edit" onclick="editSavedJob(${h.id})">Edit</button>
                    <button class="btn-small btn-delete" onclick="deleteJob(${h.id})">Del</button>
                </div>
                <div style="font-weight:800; color:var(--navy);">${h.name}</div>
                <div style="font-size:0.75rem; color:var(--gold); font-weight:700; margin: 4px 0;">${h.summary} • ${h.total}</div>
                ${h.rooms.map(r => `<div style="font-size:0.75rem; opacity:0.7;">- ${r.name}: ${r.w}'x${r.l}'</div>`).join('')}
            </div>`).join('');
    }

    function editSavedJob(id) {
        let job = JSON.parse(localStorage.getItem('choiceFloorsHistory')).find(j => j.id === id);
        currentJobRooms = [...job.rooms];
        editingJobId = job.id;
        document.getElementById('jobName').value = job.name;
        updateJobHeader();
        switchTab('workspace');
        updateRoomList();
    }

    function deleteJob(id) {
        if(confirm("Delete project?")) {
            let hist = JSON.parse(localStorage.getItem('choiceFloorsHistory')).filter(j => j.id !== id);
            localStorage.setItem('choiceFloorsHistory', JSON.stringify(hist));
            loadHistory();
        }
    }
</script>
</body>
</html>
